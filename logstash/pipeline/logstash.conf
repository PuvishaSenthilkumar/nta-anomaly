# Logstash config: Kafka (scored-flows) -> date filter -> type conversions -> Elasticsearch

# Input: Kafka scored-flows
input {
  kafka {
    topics => ["scored-flows"]
    bootstrap_servers => ["localhost:9092"]
    group_id => "logstash-group"
    codec => "json"
    start_position => "earliest"
  }
}

# Date filter
filter {
  date {
    match => [ "event_ts", "yyyy-MM-dd HH:mm:ss" ]
    add_field => { "event_type" => "scored_flow" }
  }

  # Type conversions for ES mapping compatibility
  mutate {
    add_field => { "type" => "scored_flow" }
    
    # Convert numeric strings to proper types
    gsub => [ "anomaly_dist", "^NaN$", "0" ]
    gsub => [ "attack_prob", "^NaN$", "0" ]
  }
}

# Output: Elasticsearch
output {
  elasticsearch {
    hosts => ["localhost:9200"]
    index => "nta-flows-%{+yyyy.MM.dd}"
    user => ""  # security off
    password => ""  # security off
    ssl => false
    document_type => "_doc"
  }
}