input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["scored-flows"]
    group_id          => "logstash-nta"
    auto_offset_reset => "latest"
    codec             => "json"
  }
}

filter {
  # event_ts is produced by Spark as ISO-8601 (UTC)
  date {
    match  => ["event_ts", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    convert => {
      "attack_prob"  => "float"
      "anomaly_dist" => "float"
      "dur"          => "float"
      "sbytes"       => "integer"
      "dbytes"       => "integer"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nta-flows-%{+YYYY.MM.dd}"
  }
}
