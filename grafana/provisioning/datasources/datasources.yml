apiVersion: 1

datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    isDefault: true
    url: http://localhost:9200
    user: ""
    password: ""
    secureJsonData:
      password: ""
    index: nta-flows-*

  - name: Cassandra
    type: postgres
    access: proxy
    url: http://cassandra:9042
    isDefault: false
    user: ""
    password: ""
    secureJsonData:
      password: ""
    # Cassandra plugin for Grafana uses QL data source